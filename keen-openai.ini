[DomainMapper]
# Локальные справочники фиксируют список доменов и номера DNS.
localplatform = yes
localdns = yes
service = Openai
# 1 - системный DNS; 2 - Google; 4 - Cloudflare из локального dnsdb.
# Запускайте без VPN ноутбука, чтобы учесть DNS обычного подключения.
dnsserver = 1 2 4
# Адреса CDN нужны для ChatGPT, исключать Cloudflare нельзя.
cloudflare = no
subnet = no
filename = domain-ip-openai.txt
rate_limit = 50
filetype = keenetic cli
keenetic = Wireguard1
cfginfo = yes
run = python merge_routes.py domain-ip-resolve.txt domain-ip-custom.txt domain-ip-youtube.txt domain-ip-openai.txt -o merged-routes.txt
